[project]
name = "tasks-assistant"
version = "0.2.0"
description = "Task and agent control plane: contract layer, deterministic checks and verification for Kandev + OpenCode + Hermes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27,<1",
]

[project.scripts]
tasks-assistant = "tasks_assistant.cli:main"
tasks = "tasks_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
