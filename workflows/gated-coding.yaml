# Workflow portable de Kandev — plan → build → verify → gate humano.
#
# Importar:
#   ./scripts/import-workflow.sh <workspace-id>
#
# El import no crea agentes ni modelos. Asigna el perfil OpenCode en
# Settings > Agents y el modelo por rol (planner/builder/verifier) en cada
# perfil antes de usar el workflow. El campo `agent_profile` solo enlaza el
# agente OpenCode por nombre visible; un modelo que no exista se descarta en
# silencio al importar.
version: 1
type: kandev_workflow
workflows:
  - name: Gated Coding
    description: Contrato humano, plan aprobado, build barato, checks deterministas, verifier con otro modelo y gate humano.
    prompt: |
      Trabajas dentro de una tarea con contrato. El contrato vive en
      $HOME/acastillo/assistant/contracts/tasks/{task_id}.yaml y es la fuente de
      verdad escrita por un humano.

      Reglas que aplican en todos los pasos:
      - Lee el contrato completo antes de actuar.
      - Nunca edites el contrato, los criterios de aceptación ni los comandos de test.
      - Nunca debilites tests para hacerlos pasar.
      - No toques archivos fuera de scope.paths_allow ni archivos protegidos.
      - Si el contrato es ambiguo o falta información, detente y pregunta.
      - Máximo 2 intentos de build. Al tercero, escala a un humano.
      - Al terminar cada paso, reporta qué hiciste, qué comandos corriste y qué riesgos quedan.
    agent_profile:
      agent_name: OpenCode
    steps:
      - name: Intake
        position: 0
        color: bg-neutral-400
        is_start_step: true
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Este paso es humano. Antes de mover la tarea:
          1. Crea el contrato: assistant init --id {task_id} --title "..."
          2. Completa objetivo, criterios, no-goals, scope, tests y presupuesto.
          3. Revisa que cada criterio tenga evidencia verificable.
          4. Mueve la tarea a Plan.

      - name: Plan
        position: 1
        color: bg-purple-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Rol: planner. No escribas código ni edites archivos.

          Analiza el contrato y el repo. Produce un plan con:
          - requisitos y supuestos,
          - archivos que se van a tocar,
          - pasos ordenados,
          - plan de pruebas (comandos exactos del contrato),
          - riesgos y qué no se toca.

          Guarda el plan con create_task_plan_kandev y detente para revisión
          humana. No avances a Build por tu cuenta.
        events:
          on_enter:
            - type: enable_plan_mode
            - type: auto_start_agent
          on_exit:
            - type: disable_plan_mode

      - name: Build
        position: 2
        color: bg-blue-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Rol: builder. Implementa únicamente el plan aprobado, dentro del scope.

          - Usa el modelo económico asignado a este perfil.
          - Commitea el trabajo en la worktree de la tarea.
          - No edites tests para hacerlos pasar; si un test está mal, dilo.
          - Si necesitas tocar un archivo protegido o fuera de scope, detente.

          Al terminar reporta: archivos cambiados, comandos corridos, tests que
          agregaste y riesgos. Luego pasa a Verify.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_step
              config:
                step_position: 3

      - name: Verify
        position: 3
        color: bg-yellow-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Rol: verifier. Eres read-only: no edites archivos, no commitees, no
          "arregles" nada. Otro modelo y otro proveedor hacen esta revisión.

          Paso 1 — capa determinista:
            assistant check --contract $HOME/acastillo/assistant/contracts/tasks/{task_id}.yaml --repo .
          Si falla, reporta FAIL con el log y no llames al verifier.

          Paso 2 — capa LLM:
            assistant verify --contract $HOME/acastillo/assistant/contracts/tasks/{task_id}.yaml --repo . --diff-base main --save-prompt
          Adjunta la ruta de verdict.json, el resumen y el costo.

          Si el veredicto es FAIL, lista los hallazgos blocker/major con
          archivo:línea y pasa a Human Gate. No reintentes por tu cuenta.

      - name: Human Gate
        position: 4
        color: bg-orange-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Este paso es humano. Revisa:
          - diff completo y archivos tocados,
          - verdict.json y salida de checks,
          - costo del intento: assistant report,
          - que no haya secretos, cambios de CI ni archivos protegidos.

          Decide:
          - aprobar y mover a Done,
          - devolver a Build con comentarios (máximo 2 intentos),
          - escalar si el contrato estaba mal o el riesgo es alto.

      - name: Done
        position: 5
        color: bg-green-500
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
