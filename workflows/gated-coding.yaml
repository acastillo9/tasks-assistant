# Portable Kandev workflow — spec -> plan -> build -> verify -> human gate.
#
# Import:
#   ./scripts/import-workflow.sh [workflow.yaml] [workspace-id]
#
# This workflow does not create agents or profiles. Create three profiles in
# Kandev before importing (Planner, Builder, Verifier), then confirm every step
# has the intended profile after import. Kandev matches profiles by display
# name; a missing profile leaves the step without one and the task's agent is
# used instead.
#
# The task description is the spec. The approved task plan is the contract.
# There is no tasks-assistant CLI, no per-task YAML and no $TASKS_ASSISTANT_HOME.
version: 2
type: kandev_workflow
workflows:
  - name: Gated Coding
    description: Human spec, approved plan, cheap build, independent verification with another model, human gate.
    prompt: |
      You work inside a Kandev task. The task description is the spec and the
      approved task plan is the contract. Read both before acting.

      Rules that apply to every step:
      - The human writes the task description and the test commands; do not
        edit them.
      - Never weaken tests to make them pass.
      - Stay inside the files named in the approved plan. If you need a
        protected or out-of-scope file, stop.
      - If the task is ambiguous or information is missing, stop and ask.
      - At most 2 build loops; the third is a human decision.
      - When each step ends, report what you did, which commands you ran and
        what risks remain.
    steps:
      - name: Intake
        position: 0
        color: bg-neutral-400
        prompt: |
          This step is human. Before moving the task to Plan, write the task
          description with these sections:

          Objective:
            One or two sentences. What must be true when this is done?

          Acceptance:
            - [ ] A verifiable item.
            - [ ] Another verifiable item.

          Test commands:
            - `exact command that runs non-interactively in the task workspace`
            - `another exact command`

          Out of scope:
            - What must not be touched.

          Repo/branch:
            Repository and base branch for this task.

          Risk notes:
            Anything that needs extra review (CI, auth, migrations, secrets).

          Rules:
          - Every acceptance item must be checkable by a command or a human.
          - Test commands must run without prompts or watch mode.
          - Do not move to Plan until this is complete.
        events: {}
        is_start_step: true
        show_in_command_panel: true
        allow_manual_move: true
        complete_task_on_enter: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Plan
        position: 1
        color: bg-purple-500
        prompt: |
          Role: planner. Do not write code or edit files.

          Task description:
          {{task_prompt}}

          Read the task description and inspect the repository. Produce a plan
          with:

          - requirements and assumptions,
          - an acceptance checklist mapped to the task description,
          - files that will be touched and why,
          - ordered implementation steps,
          - the exact test commands from the task description,
          - risks and what will not be touched.

          Save the plan with create_task_plan_kandev and stop for human review.
          Do not move the task to Build on your own.

          If the task description is ambiguous or an acceptance item is not
          verifiable, stop and ask.
        events:
          on_enter:
            - type: enable_plan_mode
            - type: auto_start_agent
          on_exit:
            - type: disable_plan_mode
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        complete_task_on_enter: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Planner

      - name: Build
        position: 2
        color: bg-blue-500
        prompt: |
          Role: builder. Implement only the approved plan.

          Task description:
          {{task_prompt}}

          Rules:
          - Work in the task workspace. Do not edit the task description,
            acceptance criteria or test commands.
          - Never weaken tests to make them pass. If a test is wrong, stop and
            say so.
          - Stay inside the files named in the plan. If you need a protected or
            out-of-scope file, stop.
          - Commit your changes in the task worktree.

          Run the exact test commands from the task description and report:
          - changed files,
          - commands run and their results,
          - risks and anything left undone.

          If tests fail, report the failure and still signal completion;
          Verify re-runs them independently. When your turn is complete, call
          step_complete_kandev. Do not move the task yourself.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_step
              config:
                step_position: 3
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        complete_task_on_enter: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Builder

      - name: Verify
        position: 3
        color: bg-yellow-500
        prompt: |
          Role: verifier. You are read-only: do not edit files, do not commit,
          do not fix anything. Use a different model/provider from the builder.

          Task description:
          {{task_prompt}}

          Read the approved plan and the build output. Then:

          1. Run the exact test commands from the task description. Paste the
             full output.
          2. Compare the diff with every acceptance item and the approved plan.
          3. Check that no tests were weakened and no files outside the plan or
             scope were changed.
          4. Report for each acceptance item: PASS or FAIL, with file:line
             evidence.
          5. List blockers and major findings, or write "none".

          When the report is written, call step_complete_kandev. Do not move the
          task yourself.

          If something fails, do not retry or fix it. The human gate decides.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_step
              config:
                step_position: 4
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        complete_task_on_enter: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Verifier

      - name: Human Gate
        position: 4
        color: bg-orange-500
        prompt: |
          This step is human. Review:

          - the full diff and touched files,
          - the test output and the Verify report (PASS/FAIL per acceptance
            item),
          - token usage for Plan, Build and Verify,
          - that no secrets, CI changes or out-of-scope files were touched,
          - that the approved plan still matches the task description.

          Decide:

          - approve and move to Done,
          - send back to Build with comments (at most 2 loops),
          - escalate if the task description or the plan was wrong.

          Do not approve if any acceptance item is unverified.
        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        complete_task_on_enter: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 5
        color: bg-green-500
        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
        complete_task_on_enter: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
