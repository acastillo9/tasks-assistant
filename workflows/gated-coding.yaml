# Portable Kandev workflow — plan → build → verify → human gate.
#
# Import:
#   ./scripts/import-workflow.sh <workspace-id>
#
# The import does not create agents or models. Assign the OpenCode profile in
# Settings > Agents and the model per role (planner/builder/verifier) in each
# profile before using the workflow. The `agent_profile` field only links the
# OpenCode agent by display name; a model that does not exist is silently
# dropped on import.
version: 1
type: kandev_workflow
workflows:
  - name: Gated Coding
    description: Human contract, approved plan, cheap build, deterministic checks, verifier with another model and human gate.
    prompt: |
      You work inside a task with a contract. The contract lives at
      $TASKS_ASSISTANT_HOME/contracts/tasks/{task_id}.yaml and is the source of
      truth written by a human. Set TASKS_ASSISTANT_HOME in the executor
      profile (for example /data/tasks-assistant on the VPS).

      Rules that apply to every step:
      - Read the full contract before acting.
      - Never edit the contract, the acceptance criteria or the test commands.
      - Never weaken tests to make them pass.
      - Do not touch files outside scope.paths_allow or protected files.
      - If the contract is ambiguous or information is missing, stop and ask.
      - At most 2 build attempts. On the third, escalate to a human.
      - When each step ends, report what you did, which commands you ran and what risks remain.
    agent_profile:
      agent_name: OpenCode
    steps:
      - name: Intake
        position: 0
        color: bg-neutral-400
        is_start_step: true
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          This step is human. Before moving the task:
          1. Create the contract: tasks-assistant init --id {task_id} --title "..."
          2. Complete the objective, criteria, no-goals, scope, tests and budget.
          3. Check that every criterion has verifiable evidence.
          4. Move the task to Plan.

      - name: Plan
        position: 1
        color: bg-purple-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Role: planner. Do not write code or edit files.

          Analyze the contract and the repo. Produce a plan with:
          - requirements and assumptions,
          - files that will be touched,
          - ordered steps,
          - test plan (exact commands from the contract),
          - risks and what will not be touched.

          Save the plan with create_task_plan_kandev and stop for human
          review. Do not move to Build on your own.
        events:
          on_enter:
            - type: enable_plan_mode
            - type: auto_start_agent
          on_exit:
            - type: disable_plan_mode

      - name: Build
        position: 2
        color: bg-blue-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Role: builder. Implement only the approved plan, within scope.

          - Use the economy model assigned to this profile.
          - Commit the work in the task worktree.
          - Do not edit tests to make them pass; if a test is wrong, say so.
          - If you need to touch a protected or out-of-scope file, stop.

          When finished, report: changed files, commands run, tests you
          added and risks. Then move to Verify.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_step
              config:
                step_position: 3

      - name: Verify
        position: 3
        color: bg-yellow-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          Role: verifier. You are read-only: do not edit files, do not commit,
          do not "fix" anything. Another model and another provider perform
          this review.

          Step 1 — deterministic layer:
            tasks-assistant check --contract "$TASKS_ASSISTANT_HOME/contracts/tasks/{task_id}.yaml" --repo .
          If it fails, report FAIL with the log and do not call the verifier.

          Step 2 — LLM layer:
            tasks-assistant verify --contract "$TASKS_ASSISTANT_HOME/contracts/tasks/{task_id}.yaml" --repo . --diff-base main --save-prompt
          If the workspace is not a Git repo, generate a patch and use --diff:
            diff -u /dev/null <file> > .kandev/changes.diff
            tasks-assistant verify --contract "$TASKS_ASSISTANT_HOME/contracts/tasks/{task_id}.yaml" --repo . --diff .kandev/changes.diff --save-prompt
          Attach the verdict.json path, the summary and the cost.

          If the verdict is FAIL, list the blocker/major findings with
          file:line and move to Human Gate. Do not retry on your own.

      - name: Human Gate
        position: 4
        color: bg-orange-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        prompt: |
          This step is human. Review:
          - full diff and touched files,
          - verdict.json and check output,
          - attempt cost: tasks-assistant report,
          - that there are no secrets, CI changes or protected files.

          Decide:
          - approve and move to Done,
          - send back to Build with comments (at most 2 attempts),
          - escalate if the contract was wrong or the risk is high.

      - name: Done
        position: 5
        color: bg-green-500
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
