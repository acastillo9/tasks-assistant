name: tasks-assistant

services:
  kandev:
    # Pin a real tag in .env; never use latest in a persistent deployment.
    image: ghcr.io/kdlbs/kandev:${KANDEV_VERSION:?set KANDEV_VERSION in .env}
    ports:
      - "127.0.0.1:${KANDEV_PORT:-38429}:38429"
    environment:
      KANDEV_HOME_DIR: /data
      KANDEV_LOG_LEVEL: ${KANDEV_LOG_LEVEL:-info}
    volumes:
      # The repo and the Python CLI live inside /data (see docs/runbook.md §7.1).
      - kandev-data:/data
    cpus: "2.0"
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:38429/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  kandev-data:
